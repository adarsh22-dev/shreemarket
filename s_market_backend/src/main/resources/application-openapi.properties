# ───────────────────────────────────────────────────────────────────
# OpenAPI Spec Generation Profile
# ───────────────────────────────────────────────────────────────────
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=openapi
#
# This profile uses an H2 in-memory database instead of MySQL,
# allowing the application to start quickly for OpenAPI spec
# generation without needing a running MySQL instance.
#
# The generated spec is available at:
#   http://localhost:8082/v3/api-docs
# Swagger UI:
#   http://localhost:8082/swagger-ui.html

# H2 In-Memory Database (replaces MySQL)
# NON_KEYWORDS=VALUE tells H2 not to treat 'value' as a reserved keyword
spring.datasource.url=jdbc:h2:mem:smarketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate - create schema from entities
spring.jpa.ddl-auto=create-drop
spring.jpa.show-sql=false

# Quote all SQL identifiers to avoid reserved keyword conflicts
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Disable MySQL-specific dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
